<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MacroEconomics Pro | المنصة الأكاديمية الشاملة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Premium Light Theme */
            --primary: #4338ca;
            --primary-hover: #3730a3;
            --primary-glow: rgba(67, 56, 202, 0.3);
            --secondary: #059669;
            --secondary-glow: rgba(5, 150, 105, 0.3);
            --danger: #dc2626;
            --warning: #d97706;
            
            --bg-main: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-sidebar: rgba(255, 255, 255, 0.95);
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: rgba(226, 232, 240, 0.8);
            
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -3px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 40px -5px rgba(0, 0, 0, 0.15);
            
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
            
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            /* Premium Dark Theme */
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --secondary: #34d399;
            --secondary-glow: rgba(52, 211, 153, 0.4);
            --danger: #f87171;
            --warning: #fbbf24;
            
            --bg-main: #0b1120; /* Deep Navy */
            --bg-card: rgba(30, 41, 59, 0.7);
            --bg-sidebar: rgba(15, 23, 42, 0.95);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: rgba(51, 65, 85, 0.6);
            
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 10px 25px -3px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 20px 40px -5px rgba(0, 0, 0, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        h1, h2, h3, h4 { font-family: 'Tajawal', sans-serif; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.8;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, var(--primary-glow) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, var(--secondary-glow) 0%, transparent 25%);
            background-attachment: fixed;
        }

        /* Glassmorphism Tooltip */
        .term {
            border-bottom: 2px dashed var(--primary);
            cursor: help;
            position: relative;
            font-weight: 700;
            color: var(--primary);
            display: inline-block;
            padding: 0 4px;
        }
        .term:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            white-space: nowrap;
            z-index: 1000;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            font-weight: 600;
            animation: fadeIn 0.2s ease;
        }

        /* Modern Buttons */
        .btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--primary-glow);
            transition: var(--transition);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--primary-glow);
            filter: brightness(1.1);
        }

        /* Interactive Text */
        .interactive-text {
            color: var(--primary);
            font-weight: 700;
            cursor: pointer;
            text-decoration: underline;
            text-decoration-style: dotted;
            text-underline-offset: 4px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: var(--transition);
        }
        .interactive-text:hover {
            background: var(--primary);
            color: white;
            text-decoration: none;
            box-shadow: 0 2px 10px var(--primary-glow);
        }

        /* Layout */
        .app-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
            flex-direction: row; /* Desktop Default */
        }

        /* Sidebar (Glass Effect) */
        .sidebar {
            width: 340px;
            background: var(--bg-sidebar);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px;
            box-shadow: -5px 0 30px rgba(0,0,0,0.05);
            z-index: 10;
            flex-shrink: 0;
        }
        
        .brand {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
        }
        .brand svg { color: var(--primary); width: 32px; height: 32px; }

        .nav-tabs {
            display: flex;
            gap: 8px;
            background: var(--bg-main);
            padding: 6px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            flex-shrink: 0;
        }
        .nav-tabs button {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 0;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
        }
        .nav-tabs button.active {
            background: var(--bg-card);
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        .slide-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-left: 5px;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 10px; opacity: 0.5; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        .slide-btn {
            background: transparent;
            border: 1px solid transparent;
            text-align: right;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: var(--transition);
            flex-shrink: 0;
            white-space: normal;
        }
        .slide-btn .num {
            background: var(--bg-main);
            color: var(--text-muted);
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 800;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .slide-btn:hover {
            background: var(--bg-main);
            color: var(--text-main);
        }
        .slide-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            box-shadow: 0 10px 20px var(--primary-glow);
            border-color: rgba(255,255,255,0.1);
        }
        .slide-btn.active .num {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .sidebar-footer {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
        }
        .action-btn {
            background: var(--bg-main);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: var(--transition);
        }
        .action-btn:hover { background: var(--border-color); }
        .action-btn.primary { background: var(--secondary); color: white; border: none; box-shadow: 0 4px 15px var(--secondary-glow); }
        .action-btn.primary:hover { filter: brightness(1.1); }
        .action-btn.warning { background: var(--warning); color: white; border: none; box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3); }

        /* Main Content */
        .main-area {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .content-container {
            width: 100%;
            max-width: 1000px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            padding: 50px;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Typography */
        h2.slide-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            position: relative;
        }
        h2.slide-title::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: 0;
            width: 80px;
            height: 2px;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }
        h3 { font-size: 1.4rem; color: var(--primary); margin: 25px 0 15px; display: flex; align-items: center; gap: 10px; }
        p { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.9; }
        ul, ol { margin-bottom: 25px; padding-right: 25px; color: var(--text-muted); font-size: 1.1rem; }
        li { margin-bottom: 10px; }
        strong { color: var(--text-main); font-weight: 700; }

        /* Math Blocks (Code Editor Style) */
        .math-block {
            background: #0f172a; color: #e2e8f0; padding: 20px; border-radius: var(--radius-md);
            font-family: 'Fira Code', 'Courier New', monospace; font-size: 1.1rem; direction: ltr;
            text-align: left; margin: 20px 0; box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
            border: 1px solid #334155; overflow-x: auto; line-height: 1.8; white-space: pre-wrap;
        }
        .math-block span.highlight { color: #34d399; font-weight: bold; text-shadow: 0 0 8px rgba(52, 211, 153, 0.5); }

        /* Step Boxes */
        .step-box {
            background: rgba(99, 102, 241, 0.05); border-right: 4px solid var(--primary);
            padding: 20px; border-radius: 0 var(--radius-md) var(--radius-md) 0; margin: 20px 0;
        }
        .step-box h4 { color: var(--primary); font-size: 1.2rem; margin-bottom: 10px; }

        /* Data Tables */
        .table-wrapper {
            overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radius-md);
            border: 1px solid var(--border-color); margin: 30px 0; box-shadow: var(--shadow-sm);
        }
        .data-table { width: 100%; border-collapse: collapse; text-align: center; font-size: 1rem; background: var(--bg-card); min-width: 500px; }
        .data-table th { background: var(--bg-main); color: var(--text-main); font-weight: 700; padding: 15px; border-bottom: 2px solid var(--border-color); }
        .data-table td { padding: 15px; border-bottom: 1px solid var(--border-color); color: var(--text-muted); }
        .data-table tr:last-child td { border-bottom: none; }
        .data-table tr:hover td { background: rgba(99, 102, 241, 0.05); }
        .data-table .highlight-row td { background: rgba(52, 211, 153, 0.1); color: var(--secondary); font-weight: 700; }

        /* Real World Box */
        .real-world {
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.1), rgba(52, 211, 153, 0.05));
            border: 1px solid rgba(52, 211, 153, 0.3); border-radius: var(--radius-md); padding: 25px;
            margin: 30px 0; position: relative; overflow: hidden;
        }
        .real-world::before { content: '💡'; position: absolute; top: -10px; left: -10px; font-size: 5rem; opacity: 0.1; transform: rotate(-15deg); }
        .real-world h4 { color: var(--secondary); font-size: 1.3rem; margin-bottom: 10px; position: relative; }
        .real-world p { color: var(--text-main); position: relative; margin: 0; }

        /* Graph Container */
        .graph-container {
            background: var(--bg-main); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
            padding: 30px; margin: 30px 0; box-shadow: inset 0 2px 20px rgba(0,0,0,0.02); overflow: hidden;
        }
        svg { width: 100%; height: auto; max-height: 400px; display: block; }

        /* Range Slider */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 20px 0; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%;
            background: var(--primary); cursor: pointer; margin-top: -8px;
            box-shadow: 0 0 15px var(--primary-glow); border: 3px solid var(--bg-card); transition: transform 0.2s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; cursor: pointer; background: var(--border-color); border-radius: 5px; }

        /* Quiz Styles */
        .question-block {
            background: var(--bg-main); border: 1px solid var(--border-color); border-radius: var(--radius-md);
            padding: 25px; margin-bottom: 25px; transition: var(--transition);
        }
        .question-block:hover { box-shadow: var(--shadow-sm); border-color: var(--primary-glow); }
        .question-text { font-weight: 700; font-size: 1.2rem; margin-bottom: 20px; color: var(--text-main); }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .option {
            padding: 15px 20px; border: 2px solid var(--border-color); border-radius: var(--radius-sm);
            cursor: pointer; background: var(--bg-card); font-weight: 600; color: var(--text-muted);
            transition: var(--transition); display: flex; align-items: center;
        }
        .option:hover { border-color: var(--primary); color: var(--primary); }
        .option.correct { border-color: var(--secondary); background: rgba(52, 211, 153, 0.1); color: var(--secondary); }
        .option.wrong { border-color: var(--danger); background: rgba(248, 113, 113, 0.1); color: var(--danger); }
        .explanation {
            margin-top: 20px; padding: 15px; background: rgba(251, 191, 36, 0.1);
            border-right: 4px solid var(--warning); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            display: none; color: var(--text-main); font-size: 0.95rem;
        }
        .explanation.show { display: block; animation: fadeIn 0.3s ease; }
        
        .score-box {
            text-align: center; padding: 40px; background: var(--bg-main); border-radius: var(--radius-lg);
            border: 1px dashed var(--primary); display: none; margin-top: 30px;
        }
        .score-box .score-num { font-size: 4rem; font-weight: 900; color: var(--primary); line-height: 1; margin-bottom: 10px; }

        /* Simulation Room */
        .sim-container { background: var(--bg-main); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 30px; }
        .sim-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .sim-inputs label { font-weight: 700; font-size: 1rem; margin-bottom: 8px; display: block; color: var(--text-main); }
        .sim-inputs input[type="number"] {
            width: 100%; padding: 12px 15px; border: 1px solid var(--border-color); border-radius: var(--radius-sm);
            background: var(--bg-card); color: var(--text-main); font-family: 'Cairo', sans-serif;
            font-size: 1.1rem; font-weight: 700; transition: var(--transition);
        }
        .sim-inputs input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
        .sim-slider-box { text-align: center; margin-bottom: 30px; background: var(--bg-card); padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--border-color); }
        .sim-analysis { padding: 20px; border-radius: var(--radius-md); font-size: 1.1rem; font-weight: 700; text-align: center; transition: var(--transition); border: 1px solid var(--border-color); }

        /* Utilities */
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; background: var(--primary-glow); color: var(--primary); margin-bottom: 10px; }
        
        /* Scroll to top button */
        .scroll-top {
            position: fixed; bottom: 30px; left: 30px; background: var(--primary); color: white;
            width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: var(--transition); z-index: 100;
        }
        .scroll-top.visible { opacity: 1; pointer-events: auto; }
        .scroll-top:hover { transform: translateY(-5px); }

        /* SVG Classes for specific coloring */
        .svg-axis { stroke: var(--text-muted); stroke-width: 2; }
        .svg-line-dashed { stroke: var(--text-main); stroke-width: 2; stroke-dasharray: 6,6; opacity: 0.5; }
        .svg-line-yf { stroke: var(--secondary); stroke-width: 2; stroke-dasharray: 4,4; filter: drop-shadow(0 0 5px var(--secondary-glow)); }
        .svg-line-ad { stroke: var(--danger); stroke-width: 3; filter: drop-shadow(0 0 8px rgba(248,113,113,0.5)); }
        .svg-line-as { stroke: var(--primary); stroke-width: 3; filter: drop-shadow(0 0 8px var(--primary-glow)); }
        .svg-point { fill: var(--secondary); filter: drop-shadow(0 0 10px var(--secondary-glow)); }
        .svg-text { fill: var(--text-muted); font-size: 14px; font-weight: 600; }
        .svg-text-bold { font-size: 16px; font-weight: 800; }

        /* ========================================= */
        /* MOBILE RESPONSIVE DESIGN (Fixed)          */
        /* ========================================= */
        @media (max-width: 768px) {
            .app-layout {
                flex-direction: column;
            }

            /* Top Bar (Sidebar) */
            .sidebar {
                width: 100%;
                height: auto !important;
                max-height: 45vh; /* Give it enough space but not all */
                border-left: none;
                border-bottom: 1px solid var(--border-color);
                padding: 10px;
                border-radius: 0;
                box-shadow: 0 5px 20px rgba(0,0,0,0.05);
                flex-shrink: 0;
                overflow-y: auto;
            }

            .brand {
                font-size: 1.2rem;
                margin-bottom: 10px;
                justify-content: center;
            }
            .brand svg { width: 24px !important; height: 24px !important; }

            .nav-tabs {
                margin-bottom: 10px;
                padding: 4px;
            }
            .nav-tabs button {
                padding: 6px 0;
                font-size: 0.8rem;
            }

            /* Horizontal Scroll for Lessons */
            .slide-list {
                flex-direction: row;
                overflow-x: auto;
                overflow-y: hidden;
                padding-bottom: 10px;
                gap: 10px;
                flex: none;
                -webkit-overflow-scrolling: touch;
            }

            .slide-btn {
                flex-direction: column;
                padding: 10px;
                min-width: 110px;
                text-align: center;
                border: 1px solid var(--border-color);
                background: var(--bg-main);
                font-size: 0.8rem;
            }
            .slide-btn .num {
                margin-left: 0;
                margin-bottom: 5px;
            }

            /* Footer Buttons */
            .sidebar-footer {
                flex-direction: row;
                margin-top: 10px;
                padding-top: 10px;
                gap: 8px;
                flex-wrap: nowrap;
            }
            .action-btn {
                padding: 8px 4px;
                font-size: 0.75rem;
                flex: 1;
                white-space: nowrap;
            }
            .action-btn svg { width: 14px; height: 14px; }

            /* Main Content */
            .main-area {
                padding: 10px;
                flex: 1;
                overflow-y: auto;
            }

            .content-container {
                padding: 15px;
                border-radius: var(--radius-md);
            }

            h2.slide-title {
                font-size: 1.5rem;
                margin-bottom: 15px;
                padding-bottom: 10px;
            }

            h3 { font-size: 1.1rem; margin: 15px 0 10px; }

            p, ul, ol { font-size: 0.95rem; margin-bottom: 15px; }

            .math-block {
                font-size: 0.85rem;
                padding: 12px;
                margin: 15px 0;
            }

            .options-grid, .sim-inputs {
                grid-template-columns: 1fr;
            }

            .graph-container {
                padding: 10px;
            }

            .scroll-top {
                bottom: 15px;
                left: 15px;
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
                MacroEconomics Pro
            </div>

            <div class="nav-tabs">
                <button id="tab-ch4" class="active" onclick="switchChapter('ch4')">الفصل 4</button>
                <button id="tab-ch5" onclick="switchChapter('ch5')">الفصل 5</button>
                <button id="tab-ch6" onclick="switchChapter('ch6')">الفصل 6</button>
            </div>

            <div class="slide-list" id="sidebar-list">
                <!-- Injected via JS -->
            </div>

                            <div class="math-block">C = a + b [Y - (T0 + tY)]<br>C = a + b [Y - T0 - tY]<br>C = a - bT0 + bY - btY<br><span class="highlight">C = a - bT0 + bY(1 - t)</span></div>

                        <p>يوضح منحنى <span class="term" data-tooltip="العرض الكلي (Aggregate Supply)">AS</span> كمية السلع والخدمات النهائية التي يرغب المنتجون في بيعها عند مستويات الأسعار المختلفة.</p>

        // --- APP LOGIC ---
        let currentChapter = 'ch4';

        // Init
        document.addEventListener('DOMContentLoaded', () => {

        function toggleTheme() {
            const body = document.body;

        function switchChapter(chapterId) {

        function renderSidebar() {
            const sidebar = document.getElementById('sidebar-list');

                sidebar.appendChild(btn);
            });
        }

        function loadSlide(index) {
            currentSlideIndex = index;
            document.querySelectorAll('.slide-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));

            contentBox.innerHTML = contentData[currentChapter].slides[index].html;
            contentBox.style.animation = 'none';

            if (document.getElementById('ad-slider')) initCh4Graph();
            if (document.getElementById('sim-g-slider')) runSimulation();
            
            document.getElementById('main-area').scrollTo(0, 0);
        }

        function loadSummary() {
            document.querySelectorAll('.slide-btn').forEach(btn => btn.classList.remove('active'));
            const contentBox = document.getElementById('content-box');
            contentBox.innerHTML = contentData[currentChapter].summary;
            contentBox.style.animation = 'none';
            contentBox.offsetHeight;
            contentBox.style.animation = 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
            document.getElementById('main-area').scrollTo(0, 0);
        }

        function loadQuiz() {
            document.querySelectorAll('.slide-btn').forEach(btn => btn.classList.remove('active'));
            const contentBox = document.getElementById('content-box');
            const originalData = contentData[currentChapter].quiz;
            
            // Randomize
            let shuffled = originalData.map(q => {
                const options = q.options.map((text, i) => ({ text, isCorrect: i === q.a }));
                options.sort(() => Math.random() - 0.5);
                return { q: q.q, options: options.map(o => o.text), a: options.findIndex(o => o.isCorrect), exp: q.exp };
            });
            shuffled.sort(() => Math.random() - 0.5);
            currentQuizData = shuffled;

            let html = `
                <span class="badge" style="background:var(--warning); color:white;">اختبار الفصل</span>
                <h2 class="slide-title">اختبر معرفتك</h2>

                <div class="score-box" id="score-box"></div>
            `;
            contentBox.innerHTML = html;
            contentBox.style.animation = 'none';

            contentBox.style.animation = 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1)';

            const container = document.getElementById('quiz-container');

                container.appendChild(block);
            });
            document.getElementById('main-area').scrollTo(0, 0);
        }

        function selectOption(el, qIndex, optIndex) {
            const data = currentQuizData[qIndex];
            const parent = el.parentElement;
            const options = Array.from(parent.children);
            
            userAnswers[currentChapter][qIndex] = optIndex;
            
            options.forEach(opt => {
                opt.classList.remove('correct', 'wrong');
                if (parseInt(opt.dataset.opt) === data.a) {
                    opt.classList.add('correct');
                }
            });
            
            if (optIndex !== data.a) {
                el.classList.add('wrong');
            }
            
            const expBox = document.getElementById(`exp-${qIndex}`);
            if (expBox) expBox.classList.add('show');
        }

        function showFinalScore() {
            const data = currentQuizData;
            let score = 0;
            let answered = 0;
            
            Object.keys(userAnswers[currentChapter]).forEach(qIndex => {
                answered++;
                if (userAnswers[currentChapter][qIndex] === data[qIndex].a) score++;
            });

            const scoreBox = document.getElementById('score-box');
            scoreBox.style.display = 'block';

        // --- GRAPH LOGIC ---
        function initCh4Graph() {
            const adSlider = document.getElementById('ad-slider');
            if(!adSlider) return;
            const adLine = document.getElementById('ad-line'); const adLabel = document.getElementById('ad-label');
            const eqPoint = document.getElementById('eq-point'); const eqLineY = document.getElementById('eq-line-y');
            const eqLineX = document.getElementById('eq-line-x'); const eqText = document.getElementById('eq-text');
            const ch4Status = document.getElementById('ch4-status');
            
            function update() {
                const val = parseInt(adSlider.value); 
                const yIntercept = 450 - val; 
                const m = -0.6;
                const x1 = 60, y1 = yIntercept, x2 = 400, y2 = yIntercept + m * (x2 - x1);
                
                adLine.setAttribute('y1', y1); adLine.setAttribute('y2', y2); adLabel.setAttribute('y', y2 - 10);
                
                let eqX = (324 - yIntercept) / 0.4; 
                let eqY = -eqX + 360;
                
                if (eqX < 60) { eqX = 60; eqY = 300; } 
                if (eqX > 300) { eqX = 300; eqY = 60; }
                
                eqPoint.setAttribute('cx', eqX); eqPoint.setAttribute('cy', eqY);
                eqLineY.setAttribute('x1', eqX); eqLineY.setAttribute('x2', eqX);
                eqLineX.setAttribute('y1', eqY); eqLineX.setAttribute('y2', eqY); eqText.setAttribute('x', eqX);
                
                if (eqX < 260) {
                    eqPoint.style.fill = 'var(--danger)'; eqText.style.fill = 'var(--danger)';
                    ch4Status.textContent = "⚠️ فجوة انكماشية: التوازن أقل من مستوى التوظيف الكامل (بطالة)";
                    ch4Status.style.background = "rgba(248, 113, 113, 0.1)"; ch4Status.style.color = "var(--danger)";
                } else if (eqX > 300) {
                    eqPoint.style.fill = 'var(--warning)'; eqText.style.fill = 'var(--warning)';
                    ch4Status.textContent = "⚠️ فجوة تضخمية: التوازن أعلى من مستوى التوظيف الكامل (تضخم)";
                    ch4Status.style.background = "rgba(251, 191, 36, 0.1)"; ch4Status.style.color = "var(--warning)";
                } else {
                    eqPoint.style.fill = 'var(--secondary)'; eqText.style.fill = 'var(--secondary)';
                    ch4Status.textContent = "✅ توازن كامل: التوازن يتقاطع مع مستوى التوظيف الكامل";
                    ch4Status.style.background = "rgba(52, 211, 153, 0.1)"; ch4Status.style.color = "var(--secondary)";
                }
            }
            adSlider.addEventListener('input', update); update();
        }

        function updateCh6Graph(state) {
            const asLine = document.getElementById('as-line-6'); const adLine = document.getElementById('ad-line-6');
            const eqPoint = document.getElementById('eq-point-6'); const eqLabel = document.getElementById('eq-label-6');

            adLine.setAttribute('x1', 150); adLine.setAttribute('y1', 80);  adLine.setAttribute('x2', 450); adLine.setAttribute('y2', 300);
            
            if (state === 'eq') {
                eqPoint.setAttribute('cx', 350); eqPoint.setAttribute('cy', 160); eqLabel.setAttribute('x', 350); eqLabel.setAttribute('y', 140);
                explanation.innerHTML = "✅ <strong>حالة التوازن:</strong> يتقاطع AD مع AS عند مستوى التوظيف الكامل (YF).<br><br>جرب: <span class='interactive-text' onclick='updateCh6Graph(\"gap-def\")'>فجوة انكماشية</span> | <span class='interactive-text' onclick='updateCh6Graph(\"gap-inf\")'>فجوة تضخمية</span>";
            } else if (state === 'gap-def') {
                adLine.setAttribute('x1', 100); adLine.setAttribute('y1', 130); adLine.setAttribute('x2', 400); adLine.setAttribute('y2', 350);
                eqPoint.setAttribute('cx', 250); eqPoint.setAttribute('cy', 230); eqLabel.setAttribute('x', 250); eqLabel.setAttribute('y', 210);
                explanation.innerHTML = "⚠️ <strong>فجوة انكماشية:</strong> الطلب ضعيف، التوازن أقل من YF (بطالة). <br><span class='interactive-text' onclick='updateCh6Graph(\"eq\")'>إعادة</span>";
            } else if (state === 'gap-inf') {
                adLine.setAttribute('x1', 200); adLine.setAttribute('y1', 30); adLine.setAttribute('x2', 500); adLine.setAttribute('y2', 250);
                eqPoint.setAttribute('cx', 430); eqPoint.setAttribute('cy', 130); eqLabel.setAttribute('x', 430); eqLabel.setAttribute('y', 110);
                explanation.innerHTML = "⚠️ <strong>فجوة تضخمية:</strong> الطلب مرتفع جداً، التوازن أعلى من YF (تضخم). <br><span class='interactive-text' onclick='updateCh6Graph(\"eq\")'>إعادة</span>";
            }
        }

        function updateStagGraph(type) {
            const asLine = document.getElementById('as-line-6b'); const adLine = document.getElementById('ad-line-6b');
            const eqPoint = document.getElementById('eq-point-6b'); const eqLabel = document.getElementById('eq-label-6b');
            const explanation = document.getElementById('ch6-explanation-2');
            
            asLine.setAttribute('x1', 100); asLine.setAttribute('y1', 330); asLine.setAttribute('x2', 500); asLine.setAttribute('y2', 100);
            adLine.setAttribute('x1', 150); adLine.setAttribute('y1', 80);  adLine.setAttribute('x2', 450); adLine.setAttribute('y2', 300);
            
            if (type === 'supply') {
                asLine.setAttribute('x1', 150); asLine.setAttribute('y1', 280); asLine.setAttribute('x2', 550); asLine.setAttribute('y2', 50);
                eqPoint.setAttribute('cx', 250); eqPoint.setAttribute('cy', 130); eqLabel.setAttribute('x', 250); eqLabel.setAttribute('y', 110);
                explanation.innerHTML = "⚠️ <strong>تضخم ركودي (صدمة عرض):</strong> ارتفاع التكاليف يدفع AS لليسار. النتيجة: ارتفاع الأسعار وانخفاض الناتج.<br><br><span class='interactive-text' onclick='updateStagGraph(\"reset\")'>إعادة</span>";
            } else if (type === 'demand') {
                adLine.setAttribute('x1', 200); adLine.setAttribute('y1', 30); adLine.setAttribute('x2', 500); adLine.setAttribute('y2', 250);
                eqPoint.setAttribute('cx', 430); eqPoint.setAttribute('cy', 130); eqLabel.setAttribute('x', 430); eqLabel.setAttribute('y', 110);
                explanation.innerHTML = "⚠️ <strong>تضخم ركودي (صدمة طلب):</strong> زيادة مفرطة في AD ترفع الأسعار، ثم ترفع التكاليف وتنتقل بـ AS لليسار.<br><br><span class='interactive-text' onclick='updateStagGraph(\"reset\")'>إعادة</span>";
            } else {
                eqPoint.setAttribute('cx', 300); eqPoint.setAttribute('cy', 195); eqLabel.setAttribute('x', 300); eqLabel.setAttribute('y', 175);
                explanation.innerHTML = "تضخم ركودي. انقر: <span class='interactive-text' onclick='updateStagGraph(\"supply\")'>صدمة عرض</span> | <span class='interactive-text' onclick='updateStagGraph(\"demand\")'>صدمة طلب</span>";
            }
        }

        function runSimulation() {
            const b = parseFloat(document.getElementById('sim-b').value) || 0.75;
            const t = parseFloat(document.getElementById('sim-t').value) || 0.2;
            const deltaG = parseFloat(document.getElementById('sim-g-slider').value) || 0;
            
            const multiplier = 1 / (1 - b + (b * t));
            const deltaY = deltaG * multiplier;
            
            document.getElementById('sim-g-val').textContent = deltaG > 0 ? "+" + deltaG : deltaG;
            document.getElementById('sim-mr-val').textContent = multiplier.toFixed(2);

            const yf = 7000; const currentY = 6000 + deltaY;
            const shiftPx = (deltaY / 1500) * 150;
            
            const adLine = document.getElementById('sim-ad'); 
            const eqPoint = document.getElementById('sim-eq'); 
            const analysisBox = document.getElementById('sim-analysis');
            
            adLine.setAttribute('x1', 150 + shiftPx); adLine.setAttribute('y1', 200 - (shiftPx * 0.5));
            adLine.setAttribute('x2', 450 + shiftPx); adLine.setAttribute('y2', 300 - (shiftPx * 0.5));
            
            let newEqX = 289 + shiftPx; let newEqY = 182 - (shiftPx * 0.5);
            if (newEqX < 80) newEqX = 80; if (newEqX > 480) newEqX = 480;
            
            eqPoint.setAttribute('cx', newEqX); eqPoint.setAttribute('cy', newEqY);
            
            if (currentY > yf + 100) {
                analysisBox.innerHTML = `⚠️ <strong>فجوة تضخمية!</strong> الناتج (${currentY.toFixed(0)}) تجاوز التوظيف الكامل (7000). ضغوط تضخمية.`;
                analysisBox.style.borderColor = "var(--danger)"; analysisBox.style.color = "var(--danger)"; analysisBox.style.background = "rgba(248,113,113,0.1)";
            } else if (currentY < yf - 100) {
                analysisBox.innerHTML = `⚠️ <strong>فجوة انكماشية!</strong> الناتج (${currentY.toFixed(0)}) أقل من التوظيف الكامل (7000). بطالة.`;
                analysisBox.style.borderColor = "var(--danger)"; analysisBox.style.color = "var(--danger)"; analysisBox.style.background = "rgba(248,113,113,0.1)";
            } else {
                analysisBox.innerHTML = `✅ <strong>توازن مثالي!</strong> الناتج (${currentY.toFixed(0)}) قريب من التوظيف الكامل (7000).`;
                analysisBox.style.borderColor = "var(--secondary)"; analysisBox.style.color = "var(--secondary)"; analysisBox.style.background = "rgba(52,211,153,0.1)";
            }
        }
    </script>
